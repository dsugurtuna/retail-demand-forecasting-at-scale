# =============================================================================
# Model Training Workflow
# =============================================================================
# Automated model training and registration pipeline
# Triggers on schedule or manual dispatch
# =============================================================================

name: Model Training

on:
  schedule:
    # Run weekly on Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      experiment_name:
        description: "MLflow experiment name"
        required: false
        default: "retail_forecasting"
      n_folds:
        description: "Number of CV folds"
        required: false
        default: "5"

env:
  PYTHON_VERSION: "3.11"

jobs:
  train:
    name: Train Model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download training data
        run: |
          # Download data from S3 or other source
          echo "Downloading training data..."
          mkdir -p data/raw

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python -m src.train \
            --experiment-name "${{ github.event.inputs.experiment_name || 'retail_forecasting' }}" \
            --n-folds "${{ github.event.inputs.n_folds || '5' }}"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "Registering model in MLflow Model Registry..."
          # python -m src.register_model

  evaluate:
    name: Evaluate Model
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run backtesting
        run: |
          echo "Running backtesting evaluation..."
          # python -m src.evaluate --model-path models/model.pkl

      - name: Generate report
        run: |
          echo "Generating evaluation report..."
          # python -m src.report

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/
