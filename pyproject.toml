[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "2.1.0"
description = "LightGBM demand forecasting for M5-style retail data: leakage-safe features, rolling-origin backtests and WRMSSE evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ugur Tuna"}]
keywords = ["demand-forecasting", "retail", "time-series", "lightgbm", "m5", "wrmsse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Only what the code imports. Each extra is opt-in so the core install stays small.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "pyarrow>=14.0",
    "lightgbm>=4.0",
    "scipy>=1.11",
    "holidays>=0.40",
    "pydantic>=2.5",
    "pyyaml>=6.0.1",
    "pandera>=0.24",
    "joblib>=1.3",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "retail-demand-forecasting[serve]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale"
Repository = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale"
Issues = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale/issues"
Changelog = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# ============================================================================
# Ruff (lint + format)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (FastAPI/pydantic idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================================================
# MyPy
# ============================================================================
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "slow: slower end-to-end tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
