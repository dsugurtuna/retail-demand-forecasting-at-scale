[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "2.0.0"
description = "Enterprise-grade ML pipeline for retail demand forecasting at scale"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ugur Tuna", email = "ugur.tuna@example.com"}
]
keywords = [
    "machine-learning",
    "demand-forecasting",
    "retail",
    "time-series",
    "lightgbm",
    "deep-learning",
    "mlops"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]

dependencies = [
    # Core Data Processing
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "polars>=0.20.0",  # High-performance DataFrame for large-scale processing
    "pyarrow>=14.0.0",
    
    # Machine Learning - Gradient Boosting
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    
    # Deep Learning
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "pytorch-forecasting>=1.0.0",  # TFT, N-BEATS implementations
    
    # Feature Engineering & Time Series
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "holidays>=0.40",  # UK and international holidays
    
    # MLOps & Experiment Tracking
    "mlflow>=2.9.0",
    "optuna>=3.4.0",  # Hyperparameter optimization
    "evidently>=0.4.0",  # Data drift detection
    
    # Model Explainability
    "shap>=0.44.0",
    "lime>=0.2.0",
    
    # API & Serving
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Data Validation
    "pandera>=0.18.0",
    "great-expectations>=0.18.0",
    
    # Caching & Storage
    "redis>=5.0.0",
    "boto3>=1.33.0",
    "s3fs>=2023.12.0",
    
    # Configuration & Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",  # Beautiful terminal output
    "tqdm>=4.66.0",
    
    # Monitoring & Logging
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",  # Property-based testing
    "faker>=22.0.0",
    "httpx>=0.26.0",  # Async HTTP client for API testing
    
    # Code Quality
    "black>=23.12.0",
    "isort>=5.13.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    
    # Type Stubs
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
    "types-tqdm>=4.66.0",
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    
    # Debugging & Profiling
    "ipdb>=0.13.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
    "py-spy>=0.3.14",
]

notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "altair>=5.2.0",
]

airflow = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-amazon>=8.0.0",
    "apache-airflow-providers-redis>=3.4.0",
]

[project.scripts]
forecast-train = "pipelines.scripts.train:main"
forecast-evaluate = "pipelines.scripts.evaluate:main"
forecast-serve = "pipelines.scripts.serve:main"

[project.urls]
Homepage = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale"
Documentation = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale#readme"
Repository = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale"
Issues = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale/issues"
Changelog = "https://github.com/dsugurtuna/retail-demand-forecasting-at-scale/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
  | notebooks
)/
'''

# ============================================================================
# isort Configuration
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["data/*", "notebooks/*", ".venv/*"]
known_first_party = ["src", "pipelines"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "data",
    "notebooks",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PD",     # pandas-vet
    "NPY",    # NumPy-specific rules
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
    "PD901",  # avoid using df as variable name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["src", "pipelines"]

# ============================================================================
# MyPy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "xgboost.*",
    "catboost.*",
    "shap.*",
    "mlflow.*",
    "pytorch_forecasting.*",
    "optuna.*",
    "evidently.*",
    "pandera.*",
    "great_expectations.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-W ignore::DeprecationWarning",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests requiring GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Pydantic Plugin Configuration
# ============================================================================
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
