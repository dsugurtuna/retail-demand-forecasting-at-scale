# Local containers for the two things this repository does: train and serve.
# Not built in CI yet.
#
#   docker compose run --rm training            # smoke run, writes ./artefacts/smoke
#   docker compose up api                       # serves ./artefacts/smoke/model on :8000
#
# Earlier versions also started MLflow, PostgreSQL, MinIO, Redis and Jupyter.
# The code never talked to any of them, so they are not started.

services:
  training:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.train
    volumes:
      - ./artefacts:/app/artefacts
    profiles: ["training"]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.serve
    ports:
      - "8000:8000"
    volumes:
      - ./artefacts/smoke/model:/app/models/model:ro
