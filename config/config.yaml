data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  start_date: "2011-01-29" # M5 start date
  forecast_horizon: 28

feature_engineering:
  lags: [7, 14, 21, 28]
  rolling_windows: [7, 14, 28, 60]
  categorical_features:
    - "item_id"
    - "dept_id"
    - "cat_id"
    - "store_id"
    - "state_id"
    - "event_name_1"
    - "event_type_1"
    - "snap_CA"
    - "snap_TX"
    - "snap_WI"

model:
  name: "lightgbm"
  params:
    objective: "tweedie"
    metric: "rmse"
    boosting_type: "gbdt"
    learning_rate: 0.05
    num_leaves: 128
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.7
    bagging_freq: 1
    n_estimators: 1000
    early_stopping_rounds: 50
    verbose: -1
    seed: 42

training:
  test_size: 28
  n_folds: 3
  verbose: true
